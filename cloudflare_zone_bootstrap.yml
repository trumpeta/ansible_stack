---
- hosts: localhost
  connection: local
  gather_facts: false

  vars_prompt:
    - name: cf_domain
      prompt: "Cloudflare zone / domain"
      private: no
    - name: cf_api_token
      prompt: "Cloudflare API token"
      private: yes
    - name: cf_ipv4
      prompt: "IPv4 for apex/www (leave blank to keep existing or use autodetect)"
      private: no
      default: ""
    - name: cf_ipv6
      prompt: "IPv6 for apex/www (leave blank to keep existing or use autodetect)"
      private: no
      default: ""
    - name: cf_canonical_host
      prompt: "Canonical host (apex/www/none)"
      private: no
      default: "apex"
    - name: cf_www_mode
      prompt: "WWW mode (cname/same-ip/skip)"
      private: no
      default: "cname"
    - name: cf_auto_detect_ip
      prompt: "Auto-detect public IPs when missing? (true/false)"
      private: no
      default: "false"
    - name: cf_dns_only
      prompt: "Create DNS-only records instead of proxied? (true/false)"
      private: no
      default: "false"

  tasks:
    - name: Build Cloudflare bootstrap command
      ansible.builtin.set_fact:
        cloudflare_bootstrap_argv: >-
          {{
            [
              'python3',
              playbook_dir ~ '/scripts/cloudflare_zone_bootstrap.py',
              '--domain',
              cf_domain,
              '--api-token',
              cf_api_token,
              '--canonical-host',
              cf_canonical_host,
              '--www-mode',
              cf_www_mode
            ]
            + (['--ipv4', cf_ipv4] if (cf_ipv4 | trim | length > 0) else [])
            + (['--ipv6', cf_ipv6] if (cf_ipv6 | trim | length > 0) else [])
            + (['--auto-detect-ip'] if (cf_auto_detect_ip | bool) else [])
            + (['--dns-only'] if (cf_dns_only | bool) else [])
          }}

    - name: Run Cloudflare zone bootstrap
      ansible.builtin.command:
        argv: "{{ cloudflare_bootstrap_argv }}"
      register: cloudflare_bootstrap_run
      changed_when: true

    - name: Show Cloudflare bootstrap output
      ansible.builtin.debug:
        var: cloudflare_bootstrap_run.stdout_lines
