---
- name: Validate supported Linux distribution for PHP role
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
      - ansible_distribution in php_supported_distributions
    fail_msg: "The PHP role currently supports Debian and Ubuntu only."

- name: Configure Debian PHP repository for multi-version installs
  when:
    - server_type != "ols"
    - ansible_distribution == "Debian"
  block:
    - name: Install repository prerequisites for Debian PHP packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes
        cache_valid_time: 3600
        lock_timeout: 180

    - name: Ensure APT keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Install Sury PHP repository signing key
      ansible.builtin.get_url:
        url: https://packages.sury.org/php/apt.gpg
        dest: "{{ php_sury_keyring_path }}"
        mode: "0644"
        force: true

    - name: Configure Sury PHP repository
      ansible.builtin.apt_repository:
        repo: "{{ php_sury_repository }}"
        filename: php-sury
        state: present
        update_cache: yes

  rescue:
    - name: Fail with Debian PHP repository guidance
      ansible.builtin.fail:
        msg: "Unable to configure the Sury PHP repository for Debian. Multi-version PHP package installation cannot continue."

- name: Configure Ubuntu PHP repository for multi-version installs
  when:
    - server_type != "ols"
    - ansible_distribution == "Ubuntu"
  block:
    - name: Install repository prerequisites for Ubuntu PHP packages
      ansible.builtin.apt:
        name:
          - software-properties-common
          - ca-certificates
        state: present
        update_cache: yes
        cache_valid_time: 3600
        lock_timeout: 180

    - name: Configure Ondrej PHP PPA
      ansible.builtin.apt_repository:
        repo: ppa:ondrej/php
        state: present
        update_cache: yes

  rescue:
    - name: Fail with Ubuntu PHP repository guidance
      ansible.builtin.fail:
        msg: "Unable to configure the Ondrej PHP repository for Ubuntu. Multi-version PHP package installation cannot continue."

- name: Install PHP packages for OpenLiteSpeed
  ansible.builtin.apt:
    name: "{{ php_ols_all_packages | from_yaml }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600
    lock_timeout: 180
  when: server_type == "ols"
  register: php_ols_install
  retries: "{{ php_package_retries }}"
  delay: "{{ php_package_delay }}"
  until: php_ols_install is succeeded

- name: Install PHP-FPM and CLI packages for Nginx/Apache
  ansible.builtin.apt:
    name: "{{ php_fpm_all_packages | from_yaml }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600
    lock_timeout: 180
  when: server_type != "ols"
  register: php_fpm_install
  retries: "{{ php_package_retries }}"
  delay: "{{ php_package_delay }}"
  until: php_fpm_install is succeeded

- name: Ensure PHP-FPM services are enabled and started
  ansible.builtin.systemd:
    name: "{{ item.value.fpm_service | default('php' ~ item.value.version ~ '-fpm') }}"
    state: started
    enabled: yes
  loop: "{{ php_versions_all | dict2items }}"
  when: server_type != "ols"

- name: Wait for PHP-FPM sockets
  ansible.builtin.wait_for:
    path: "{{ item.value.fpm_socket | default('/run/php/php' ~ item.value.version ~ '-fpm.sock') }}"
    timeout: 30
  loop: "{{ php_versions_all | dict2items }}"
  when: server_type != "ols"

- name: Detect OpenLiteSpeed php.ini paths
  ansible.builtin.find:
    paths: "/usr/local/lsws/lsphp{{ item.key }}/etc"
    patterns: php.ini
    recurse: yes
    file_type: file
  loop: "{{ php_versions_all | dict2items }}"
  register: php_ols_ini_search
  when: server_type == "ols"

- name: Initialize OpenLiteSpeed php.ini path map
  ansible.builtin.set_fact:
    php_ols_ini_paths: {}
  when: server_type == "ols"

- name: Build OpenLiteSpeed php.ini path map
  ansible.builtin.set_fact:
    php_ols_ini_paths: "{{ php_ols_ini_paths | combine({ item.item.key: php_ini_path }) }}"
  vars:
    php_ini_path: "{{ (item.files | map(attribute='path') | select('search', '/litespeed/php\\.ini$') | list | first) | default((item.files | map(attribute='path') | list | first), true) }}"
  loop: "{{ php_ols_ini_search.results | default([]) }}"
  when: server_type == "ols"

- name: Ensure OpenLiteSpeed php.ini paths were detected
  ansible.builtin.assert:
    that:
      - php_ols_ini_paths[item.key] is defined
      - php_ols_ini_paths[item.key] | length > 0
    fail_msg: "Unable to locate php.ini for lsphp{{ item.key }} under /usr/local/lsws."
  loop: "{{ php_versions_all | dict2items }}"
  when: server_type == "ols"

- name: Ensure FPM php.ini files exist
  ansible.builtin.stat:
    path: "/etc/php/{{ item.value.version }}/fpm/php.ini"
  loop: "{{ php_versions_all | dict2items }}"
  register: php_fpm_ini_stats
  when: server_type != "ols"

- name: Ensure CLI php.ini files exist
  ansible.builtin.stat:
    path: "/etc/php/{{ item.value.version }}/cli/php.ini"
  loop: "{{ php_versions_all | dict2items }}"
  register: php_cli_ini_stats
  when: server_type != "ols"

- name: Validate detected FPM php.ini files
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Missing FPM php.ini for PHP {{ item.item.value.version }}."
  loop: "{{ php_fpm_ini_stats.results | default([]) }}"
  when: server_type != "ols"

- name: Validate detected CLI php.ini files
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Missing CLI php.ini for PHP {{ item.item.value.version }}."
  loop: "{{ php_cli_ini_stats.results | default([]) }}"
  when: server_type != "ols"

- name: Configure OpenLiteSpeed php.ini settings
  ansible.builtin.ini_file:
    path: "{{ php_ols_ini_paths[item.0.key] }}"
    section: null
    option: "{{ item.1.key }}"
    value: "{{ item.1.value }}"
  loop: "{{ (php_versions_all | dict2items) | product(php_ini_settings | dict2items) | list }}"
  when: server_type == "ols"

- name: Configure PHP-FPM php.ini settings
  ansible.builtin.ini_file:
    path: "/etc/php/{{ item.0.value.version }}/fpm/php.ini"
    section: null
    option: "{{ item.1.key }}"
    value: "{{ item.1.value }}"
  loop: "{{ (php_versions_all | dict2items) | product(php_ini_settings | dict2items) | list }}"
  when: server_type != "ols"

- name: Configure PHP-CLI php.ini settings
  ansible.builtin.ini_file:
    path: "/etc/php/{{ item.0.value.version }}/cli/php.ini"
    section: null
    option: "{{ item.1.key }}"
    value: "{{ item.1.value }}"
  loop: "{{ (php_versions_all | dict2items) | product(php_ini_settings | dict2items) | list }}"
  when: server_type != "ols"

- name: Restart PHP-FPM services after configuration changes
  ansible.builtin.systemd:
    name: "{{ item.value.fpm_service | default('php' ~ item.value.version ~ '-fpm') }}"
    state: restarted
    enabled: yes
  loop: "{{ php_versions_all | dict2items }}"
  when: server_type != "ols"

- name: Wait for PHP-FPM sockets after restart
  ansible.builtin.wait_for:
    path: "{{ item.value.fpm_socket | default('/run/php/php' ~ item.value.version ~ '-fpm.sock') }}"
    timeout: 30
  loop: "{{ php_versions_all | dict2items }}"
  when: server_type != "ols"

- name: Request OpenLiteSpeed PHP workers to reload configuration
  ansible.builtin.file:
    path: /usr/local/lsws/admin/tmp/.lsphp_restart.txt
    state: touch
    mode: "0644"
  when: server_type == "ols"

- name: Restart OpenLiteSpeed after PHP configuration changes
  ansible.builtin.systemd:
    name: lshttpd
    state: restarted
    enabled: yes
  when: server_type == "ols"

- name: Create PHP version config directory
  ansible.builtin.file:
    path: /usr/local/etc/php-versions
    state: directory
    mode: "0755"

- name: Create PHP version switcher script
  ansible.builtin.copy:
    dest: /usr/local/bin/php-switch
    mode: "0755"
    content: |
      #!/bin/bash
      # PHP Version Switcher

      if [ -z "$1" ]; then
        echo "Usage: php-switch <version> [server_type]"
        echo "Example: php-switch {{ php_active }} {{ server_type }}"
        echo ""
        echo "Available versions:"
      {% for version_key, version_info in php_versions_all.items() %}
        echo "{{ version_key }} - {{ version_info.label }}"
      {% endfor %}
        echo ""
        echo "Available configs in /usr/local/etc/php-versions/:"
        ls -1 /usr/local/etc/php-versions/ 2>/dev/null || echo "No version configs found"
        exit 1
      fi

      VERSION=$1
      SERVER_TYPE=${2:-{{ server_type }}}
      CONFIG_DIR="/usr/local/etc/php-versions"
      CONFIG_FILE="$CONFIG_DIR/${VERSION}-${SERVER_TYPE}.conf"

      if [ -f "$CONFIG_FILE" ]; then
        echo "Switching to PHP $VERSION ($SERVER_TYPE)..."
        source "$CONFIG_FILE"
        echo "Configuration loaded from $CONFIG_FILE"
      else
        echo "Config not found: $CONFIG_FILE"
        exit 1
      fi

- name: Create LiteSpeed external app configs for all versions
  ansible.builtin.copy:
    dest: "/usr/local/etc/php-versions/{{ item.key }}-ols-external-apps.conf"
    mode: "0644"
    content: |
      # LiteSpeed External App Configuration for {{ item.value.label }}
      <extprocessor lsphp{{ item.key }}>
        className                lsapi
        enableLEApi              1
        processName              lsphp{{ item.key }}
        versionNumber            {{ item.value.version }}.{{ item.value.patch }}
        maxConns                 10
        env                      PHP_LSAPI_MAX_REQUESTS=500
        env                      PHP_LSAPI_CHILDREN=35
        initTimeout              60
        retryTimeout             0
        persistConn              1
        respBuffer               0
        autoStart                2
        path                     /usr/local/lsws/lsphp{{ item.value.major_minor_compact | default(item.key) }}/bin/lsphp
        backlog                  100
        instances                1
        priority                 0
        memSoftLimit             2047M
        memHardLimit             2048M
        procHardLimit            500
      </extprocessor>
  loop: "{{ php_versions_all | dict2items }}"
  when: server_type == "ols"

- name: Create Nginx upstream definitions for all versions
  ansible.builtin.copy:
    dest: /usr/local/etc/php-versions/php-nginx-upstreams.conf
    mode: "0644"
    content: |
      # Nginx upstream PHP-FPM configurations for all installed PHP versions
      {% for version_key, version_info in php_versions_all.items() %}
      upstream phpfpm_{{ version_key }} {
          server unix:{{ version_info.fpm_socket | default('/run/php/php' ~ version_info.version ~ '-fpm.sock') }};
          keepalive 32;
      }
      {% endfor %}
  when: server_type == "nginx"

- name: Create Apache proxy definitions for all versions
  ansible.builtin.copy:
    dest: /usr/local/etc/php-versions/php-apache-proxies.conf
    mode: "0644"
    content: |
      # Apache PHP-FPM proxy configurations for all installed PHP versions
      {% for version_key, version_info in php_versions_all.items() %}
      <Proxy "unix:{{ version_info.fpm_socket | default('/run/php/php' ~ version_info.version ~ '-fpm.sock') }}|fcgi://phpfpm-{{ version_key }}">
          ProxySet connectiontimeout=5 timeout=30
      </Proxy>
      {% endfor %}
  when: server_type == "apache"

- name: Create version-specific switcher shell configs
  ansible.builtin.copy:
    dest: "/usr/local/etc/php-versions/{{ item.key }}-{{ server_type }}.conf"
    mode: "0644"
    content: |
      # Activate {{ item.value.label }} in {{ server_type | upper }}
      export PHP_VERSION="{{ item.value.version }}.{{ item.value.patch }}"
      export PHP_MAJOR="{{ item.key }}"
      export PHP_LABEL="{{ item.value.label }}"
      {% if server_type == 'ols' %}
      export EXTPROCESSOR="lsphp{{ item.key }}"
      {% elif server_type == 'nginx' %}
      export UPSTREAM="phpfpm_{{ item.key }}"
      export PHP_FPM_SOCKET="{{ item.value.fpm_socket | default('/run/php/php' ~ item.value.version ~ '-fpm.sock') }}"
      {% elif server_type == 'apache' %}
      export PROXY="phpfpm-{{ item.key }}"
      export PHP_FPM_SOCKET="{{ item.value.fpm_socket | default('/run/php/php' ~ item.value.version ~ '-fpm.sock') }}"
      {% endif %}
  loop: "{{ php_versions_all | dict2items }}"
