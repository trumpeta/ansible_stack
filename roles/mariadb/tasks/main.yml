- name: Install MariaDB server packages
  ansible.builtin.apt:
    name: "{{ mariadb_packages }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600
    lock_timeout: 180

- name: Ensure MariaDB is running
  ansible.builtin.systemd:
    name: "{{ mariadb_service_name }}"
    state: started
    enabled: yes

- name: Wait for MariaDB socket
  ansible.builtin.wait_for:
    path: "{{ mariadb_socket }}"
    timeout: 30

- name: Create SQL bootstrap script for application database
  ansible.builtin.copy:
    dest: /root/ansible_db_setup.sql
    mode: "0600"
    content: |
      CREATE DATABASE IF NOT EXISTS `{{ db_name }}` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      CREATE USER IF NOT EXISTS '{{ db_user }}'@'localhost' IDENTIFIED BY '{{ db_pass_sql_escaped }}';
      ALTER USER '{{ db_user }}'@'localhost' IDENTIFIED BY '{{ db_pass_sql_escaped }}';
      GRANT ALL PRIVILEGES ON `{{ db_name }}`.* TO '{{ db_user }}'@'localhost';
      FLUSH PRIVILEGES;

- name: Initialize or repair application database and user
  ansible.builtin.shell: mysql --protocol=socket --socket={{ mariadb_socket }} < /root/ansible_db_setup.sql
  changed_when: true
  register: mariadb_bootstrap
  retries: 3
  delay: 5
  until: mariadb_bootstrap.rc == 0
