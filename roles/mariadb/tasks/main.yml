- name: Install MariaDB server packages
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    state: present

- name: Ensure MariaDB is running
  ansible.builtin.systemd:
    name: mariadb
    state: started
    enabled: yes

- name: Create SQL bootstrap script for application database
  ansible.builtin.copy:
    dest: /root/ansible_db_setup.sql
    mode: "0600"
    content: |
      CREATE DATABASE IF NOT EXISTS `{{ db_name }}` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      CREATE USER IF NOT EXISTS '{{ db_user }}'@'localhost' IDENTIFIED BY '{{ db_pass_sql_escaped }}';
      ALTER USER '{{ db_user }}'@'localhost' IDENTIFIED BY '{{ db_pass_sql_escaped }}';
      GRANT ALL PRIVILEGES ON `{{ db_name }}`.* TO '{{ db_user }}'@'localhost';
      FLUSH PRIVILEGES;

- name: Initialize application database and user
  ansible.builtin.shell: mysql --protocol=socket --socket=/run/mysqld/mysqld.sock < /root/ansible_db_setup.sql
  changed_when: true
