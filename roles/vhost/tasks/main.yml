- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
  when: server_type == "nginx"

- name: Start Nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: yes
  when: server_type == "nginx"

- name: Install Apache
  ansible.builtin.apt:
    name: apache2
    state: present
  when: server_type == "apache"

- name: Enable required Apache modules
  ansible.builtin.command: "a2enmod {{ item }}"
  register: apache_module_enable
  changed_when: "'already enabled' not in apache_module_enable.stdout"
  failed_when:
    - apache_module_enable.rc != 0
    - "'already enabled' not in apache_module_enable.stdout"
  loop:
    - proxy
    - proxy_fcgi
    - setenvif
    - rewrite
  when: server_type == "apache"
  notify: Reload Apache

- name: Start Apache
  ansible.builtin.systemd:
    name: apache2
    state: started
    enabled: yes
  when: server_type == "apache"

- name: Ensure site root directory exists
  ansible.builtin.file:
    path: "{{ vhost_site_root }}"
    state: directory
    owner: "{{ vhost_webroot_owner }}"
    group: "{{ vhost_webroot_group }}"
    mode: "{{ vhost_site_root_mode }}"

- name: Ensure current vhost root directory exists
  ansible.builtin.file:
    path: "{{ vhost_current_path }}"
    state: directory
    owner: "{{ vhost_webroot_owner }}"
    group: "{{ vhost_webroot_group }}"
    mode: "{{ vhost_current_mode }}"

- name: Ensure document root directory exists
  ansible.builtin.file:
    path: "{{ vhost_document_root }}"
    state: directory
    owner: "{{ vhost_webroot_owner }}"
    group: "{{ vhost_webroot_group }}"
    mode: "{{ vhost_webroot_mode }}"

- name: Create Nginx virtual host config
  ansible.builtin.template:
    src: nginx_vhost.conf.j2
    dest: "/etc/nginx/sites-available/{{ domain }}"
  when: server_type == "nginx"
  notify: Reload Nginx

- name: Enable Nginx site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ domain }}"
    dest: "/etc/nginx/sites-enabled/{{ domain }}"
    state: link
    force: yes
  when: server_type == "nginx"
  notify: Reload Nginx

- name: Create Apache virtual host config
  ansible.builtin.template:
    src: apache_vhost.conf.j2
    dest: "/etc/apache2/sites-available/{{ domain }}.conf"
  when: server_type == "apache"
  notify: Reload Apache

- name: Enable Apache site
  ansible.builtin.command: "a2ensite {{ domain }}.conf"
  register: apache_ensite_result
  changed_when: "'already enabled' not in apache_ensite_result.stdout"
  failed_when:
    - apache_ensite_result.rc != 0
    - "'already enabled' not in apache_ensite_result.stdout"
  when: server_type == "apache"
  notify: Reload Apache

- name: Ensure OpenLiteSpeed vhost directory exists
  ansible.builtin.file:
    path: /usr/local/lsws/conf/vhosts
    state: directory
    mode: "0755"
  when: server_type == "ols"

- name: Create OpenLiteSpeed virtual host config
  ansible.builtin.template:
    src: litespeed_vhost.conf.j2
    dest: "/usr/local/lsws/conf/vhosts/{{ domain }}.conf"
  when: server_type == "ols"
  notify: Reload LiteSpeed

- name: Create log directories for OLS
  ansible.builtin.file:
    path: /usr/local/lsws/logs
    state: directory
  when: server_type == "ols"
