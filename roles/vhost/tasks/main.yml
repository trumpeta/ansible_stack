- name: Install Nginx
  apt:
    name: nginx
    state: present
  when: server_type == "nginx"

- name: Start Nginx
  systemd:
    name: nginx
    state: started
    enabled: yes
  when: server_type == "nginx"

- name: Install Apache
  apt:
    name: apache2
    state: present
  when: server_type == "apache"

- name: Start Apache
  systemd:
    name: apache2
    state: started
    enabled: yes
  when: server_type == "apache"

- name: Create web root directory
  file:
    path: "{{ vhost_webroot_base }}/{{ domain }}/current"
    state: directory
    recurse: yes
    owner: "{{ vhost_webroot_owner }}"
    group: "{{ vhost_webroot_group }}"
    mode: "{{ vhost_webroot_mode }}"

- name: Check if Nginx vhost config exists
  ansible.builtin.stat:
    path: "/etc/nginx/sites-available/{{ domain }}"
  register: nginx_config_stat
  when: server_type == "nginx"

- name: Create Nginx virtual host config (skip if exists)
  template:
    src: nginx_vhost.conf.j2
    dest: "/etc/nginx/sites-available/{{ domain }}"
  when: server_type == "nginx" and not nginx_config_stat.stat.exists
  notify: Reload Nginx

- name: Enable Nginx site
  file:
    src: "/etc/nginx/sites-available/{{ domain }}"
    dest: "/etc/nginx/sites-enabled/{{ domain }}"
    state: link
  when: server_type == "nginx"
  notify: Reload Nginx

- name: Check if Apache vhost config exists
  ansible.builtin.stat:
    path: "/etc/apache2/sites-available/{{ domain }}.conf"
  register: apache_config_stat
  when: server_type == "apache"

- name: Create Apache virtual host config (skip if exists)
  template:
    src: apache_vhost.conf.j2
    dest: "/etc/apache2/sites-available/{{ domain }}.conf"
  when: server_type == "apache" and not apache_config_stat.stat.exists
  notify: Reload Apache

- name: Enable Apache site (skip if already enabled)
  command: a2ensite {{ domain }}
  register: apache_ensite_result
  changed_when: "'already enabled' not in apache_ensite_result.stderr"
  failed_when: apache_ensite_result.rc != 0 and "'already enabled' not in apache_ensite_result.stderr"
  when: server_type == "apache"
  notify: Reload Apache

- name: Check if OLS vhost config exists
  ansible.builtin.stat:
    path: "/usr/local/lsws/conf/vhosts/{{ domain }}.conf"
  register: ols_config_stat
  when: server_type == "ols"

- name: Create OpenLiteSpeed virtual host config (skip if exists)
  template:
    src: litespeed_vhost.conf.j2
    dest: "/usr/local/lsws/conf/vhosts/{{ domain }}.conf"
  when: server_type == "ols" and not ols_config_stat.stat.exists
  notify: Reload LiteSpeed

- name: Create log directories for OLS
  file:
    path: "/usr/local/lsws/logs/{{ domain }}"
    state: directory
  when: server_type == "ols"
