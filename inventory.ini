# Ansible inventory for HTTP Server deployments
# Ubuntu/Debian based systems

[web]
# Single server deployment example:
# server_ip_or_hostname ansible_user=root
#
# Example with explicit name:
# web01 ansible_host=192.168.1.10 ansible_user=root
#
# Example with custom SSH port:
# web01 ansible_host=192.168.1.10 ansible_user=root ansible_port=2222

# Placeholder for dynamic inventory population
# Use: ansible-playbook -i <inventory_file> interactive_full.yml

[web:vars]
# Common variables for web servers
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3

# Optional: define groups for different deployment stages
[staging]
# staging_web01 ansible_host=192.168.1.100 ansible_user=ubuntu

[production]
# prod_web01 ansible_host=192.168.1.200 ansible_user=ubuntu
# prod_web02 ansible_host=192.168.1.201 ansible_user=ubuntu

[all:vars]
# Global settings
ansible_port=22
